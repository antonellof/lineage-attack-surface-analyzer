# Third lineage (ADR-0032). Same protocol as the v3 studies with two changes made
# before any outcome: the mismatched suffix is a primary control, so the frozen rule
# itself tests behavior-specific transfer, and 80 behaviors (40 development, 40
# held-out) raise power. Every target is a declared child of the source.
