# scripts/select_roster.py; experiments/results/study-gemma3-v1/roster_selection.json
# records every candidate and why it was kept or dropped. Two changes from the v3
# protocol, both made before outcomes: the mismatched suffix is a primary control,
# and 80 behaviors (40 development, 40 held-out) raise power.
